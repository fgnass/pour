<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#131416" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pour" />
    <meta name="description" content="Acrylic open cup pour simulator. Tilt your phone to make the paint flow." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pour.gnass.buzz/" />
    <meta property="og:title" content="Pour" />
    <meta property="og:description" content="Acrylic open cup pour simulator. Tilt your phone to make the paint flow." />
    <meta property="og:image" content="https://pour.gnass.buzz/screenshots/og.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Pour: swirls of teal, plum and pink acrylic paint with the word pour" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-192x192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Pour</title>
  </head>
  <body>
    <div id="stage"><canvas id="gl"></canvas></div>
    <div id="cupfill" class="cupfill" hidden>
      <canvas></canvas>
      <div class="cupfill-actions">
        <button id="cupSet" class="primary">Done</button>
      </div>
    </div>

    <div id="hud">
      <header class="top">
        <button id="menuBtn" class="round" aria-label="Menu">
          <span class="icon" data-icon="menu"></span>
        </button>
        <p id="hint" class="hint" aria-live="polite"></p>
      </header>

      <footer class="dock">
        <div class="paints">
          <button id="paletteBtn" class="swatch palette-btn" aria-label="Palette">
            <span class="icon" data-icon="palette"></span>
          </button>
          <div id="paints" role="radiogroup" aria-label="Paint"></div>
        </div>
        <div class="tools">
          <div class="seg" id="tools" role="radiogroup" aria-label="Tool">
            <button data-tool="pour" role="radio">
              <span class="icon" data-icon="water_drop" data-fill></span>
              <span>Pour</span>
            </button>
            <button data-tool="cup" role="radio">
              <span class="icon" data-icon="glass_cup" data-fill></span>
              <span>Cup</span>
            </button>
            <button data-tool="swipe" role="radio">
              <span class="icon" data-icon="swipe" data-fill></span>
              <span>Swipe</span>
            </button>
            <button data-tool="torch" role="radio">
              <span class="icon" data-icon="local_fire_department" data-fill></span>
              <span>Torch</span>
            </button>
            <button data-tool="tilt" role="radio">
              <span class="icon" data-icon="3d_rotation" data-fill></span>
              <span>Tilt</span>
            </button>
          </div>
        </div>
      </footer>
    </div>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-panel" role="dialog" aria-label="Menu">
        <button data-act="new">New canvas</button>
        <button data-act="demo">Play demo</button>
        <button data-act="save">Save image</button>
        <button data-act="sound">Sound: on</button>
        <button data-act="help">How it works</button>
        <button data-act="install" hidden>Install app</button>
        <div class="sheet-sep"></div>
        <a href="https://github.com/fgnass/pour" target="_blank" rel="noopener">Source on GitHub</a>
        <a href="https://gnass.buzz/privacy" target="_blank" rel="noopener">Privacy</a>
      </div>
    </div>

    <div id="palettes" class="sheet sheet-bottom" hidden>
      <div class="sheet-panel" role="dialog" aria-label="Palettes"></div>
    </div>

    <div id="start" class="start">
      <div class="start-panel">
        <h1 class="logo"><img src="/start.jpg" alt="Pour" width="1000" height="605" /></h1>
        <p class="lead">Pour simulates acrylic pouring, a fluid art technique where layers of paint flow into cells and swirls. Fill a cup with colours, release it on the canvas and tilt your phone to let the paint spread.</p>
        <div class="start-actions">
          <button id="startBtn" class="primary">Start</button>
          <button id="demoBtn">Watch demo</button>
        </div>
        <button id="installBtn" class="install" hidden>Install app</button>
        <p id="installHelp" class="note" hidden></p>
        <p class="start-links">
          <a href="https://github.com/fgnass/pour" target="_blank" rel="noopener">GitHub</a>
          <span aria-hidden="true">·</span>
          <a href="https://gnass.buzz/privacy" target="_blank" rel="noopener">Privacy</a>
        </p>
      </div>
    </div>

    <div id="error" class="start" hidden><div class="start-panel"><h1>Sorry</h1><p id="errorMsg"></p></div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
